name: Build Mobile App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Toolchain pins: JDK 17 (Temurin) below; Gradle 8.10.2 through the committed
# wrapper (distributionSha256Sum is checked); Kotlin 2.0.21 in build.gradle.kts.
# Every step is fail-closed: no `|| true` anywhere.
env:
  JAVA_VERSION: '17'

jobs:
  shared-jvm:
    name: Shared module (JVM build + allTests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Tagged major (not SHA-pinned); also validates the committed wrapper jar.
      - uses: gradle/actions/setup-gradle@v4
      # On Linux, allTests runs the commonTest suite on the JVM target
      # (Apple targets are skipped on non-macOS hosts).
      - name: Build and test shared module
        run: ./gradlew :shared:build :shared:allTests --stacktrace

  shared-ios:
    name: Shared module (iOS simulator tests)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run commonTest on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
